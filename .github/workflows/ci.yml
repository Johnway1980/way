name: CI

on:
  push:
    branches: [ main, 'fix/**' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: 'recursive'

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Ensure Gradle wrapper and run tests
        run: |
          set -e
          # If wrapper exists, use it; otherwise install gradle, generate wrapper, then use it.
          if [ -x ./gradlew ]; then
            ./gradlew :app:test --no-daemon --stacktrace || ./gradlew test --no-daemon --stacktrace
          else
            sudo apt-get update -y
            sudo apt-get install -y gradle unzip
            gradle wrapper --gradle-version 8.4
            chmod +x ./gradlew
            ./gradlew :app:test --no-daemon --stacktrace || ./gradlew test --no-daemon --stacktrace
          fi
