name: CI

on:
  push:
    branches: [ main, 'fix/**' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: 'recursive'

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare gradle.properties for runner
        run: |
          # Use a CI-specific gradle.properties (do not overwrite local developer settings)
          if [ -f .github/gradle/gradle.properties.ci ]; then
            echo "Copying CI gradle.properties to project root"
            cp .github/gradle/gradle.properties.ci gradle.properties
          else
            # Fallback: try to sanitize existing gradle.properties
            if [ -f gradle.properties ]; then
              if grep -q "^org.gradle.java.home" gradle.properties; then
                echo "Commenting org.gradle.java.home in gradle.properties for CI runner"
                sed -i.bak 's/^org.gradle.java.home=.*$/#&/' gradle.properties || true
              fi
              # Replace the entire org.gradle.jvmargs with a CI-safe default
              sed -i.bak "s#^org.gradle.jvmargs=.*#org.gradle.jvmargs=-Xmx2048m -Xms512m -Dfile.encoding=UTF-8#" gradle.properties || true
            fi
          fi

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Ensure Gradle wrapper and run tests
        run: |
          set -e
          # If wrapper exists, use it; otherwise install gradle, generate wrapper, then use it.
          if [ -x ./gradlew ]; then
            # Ensure temporary dir properties are CI-safe
            ./gradlew -Djava.io.tmpdir=/tmp -Dorg.sqlite.tmpdir=/tmp :app:test --no-daemon --stacktrace || ./gradlew -Djava.io.tmpdir=/tmp -Dorg.sqlite.tmpdir=/tmp test --no-daemon --stacktrace
          else
            sudo apt-get update -y
            sudo apt-get install -y gradle unzip
            gradle wrapper --gradle-version 8.4
            chmod +x ./gradlew
            ./gradlew -Djava.io.tmpdir=/tmp -Dorg.sqlite.tmpdir=/tmp :app:test --no-daemon --stacktrace || ./gradlew -Djava.io.tmpdir=/tmp -Dorg.sqlite.tmpdir=/tmp test --no-daemon --stacktrace
          fi
