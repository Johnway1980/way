name: CI

on:
  push:
    branches: [ main, 'fix/**' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: 'recursive'

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare gradle.properties for runner
        run: |
          # On CI runners (Linux) a Windows-local org.gradle.java.home entry can break Gradle.
          if [ -f gradle.properties ]; then
            if grep -q "^org.gradle.java.home" gradle.properties; then
              echo "Commenting org.gradle.java.home in gradle.properties for CI runner"
              sed -i.bak 's/^org.gradle.java.home=.*$/#&/' gradle.properties || true
            fi
            # Remove Windows-specific temp dir JVM args that point to C:\ paths
            if grep -q "-Dorg.sqlite.tmpdir" gradle.properties || grep -q "-Djava.io.tmpdir" gradle.properties; then
              echo "Removing Windows tempdir JVM args from org.gradle.jvmargs"
              # Replace the entire org.gradle.jvmargs with a CI-safe default
              sed -i.bak "s#^org.gradle.jvmargs=.*#org.gradle.jvmargs=-Xmx2048m -Xms512m -Dfile.encoding=UTF-8#" gradle.properties || true
            fi
          fi

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Ensure Gradle wrapper and run tests
        run: |
          set -e
          # If wrapper exists, use it; otherwise install gradle, generate wrapper, then use it.
          if [ -x ./gradlew ]; then
            ./gradlew :app:test --no-daemon --stacktrace || ./gradlew test --no-daemon --stacktrace
          else
            sudo apt-get update -y
            sudo apt-get install -y gradle unzip
            gradle wrapper --gradle-version 8.4
            chmod +x ./gradlew
            ./gradlew :app:test --no-daemon --stacktrace || ./gradlew test --no-daemon --stacktrace
          fi
